# Enable full 256-color support for Neovim themes
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Enable mouse support (allows you to click and resize panes)
set -g mouse on

# Increase history scrollback limit
set -g history-limit 10000

# Start window and pane indexing at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Don't rename windows automatically
set-option -g allow-rename off

# 1. Enable full mouse support (scroll wheel, pane clicking, pane resizing)
set -g mouse on

# 2. Fix terminal scrolling behavior and color compatibility
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# 3. Optional: Increase scroll history buffer to 10,000 lines
set -g history-limit 10000

